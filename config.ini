# 环境温度设备排期看板 服务配置（修改后需重新启动 LabScheduler.exe）

# 访问端口。浏览器地址为 http://localhost:端口
port=8080

# CSV 数据文件夹。可写相对路径（相对本程序所在目录）或绝对路径，例如 csv_dir=E:\1
csv_dir=csv

# 页面文件。本程序目录下有该文件时优先使用它（方便以后只替换 HTML 升级）；没有时使用程序内置版本
html_file=lab-scheduler.html

# 图片文件夹（设备图片、网页图标 favicon.png）。留空时依次查找：本程序目录\photo、CSV 文件夹\photo、CSV 文件夹上一级\photo
photo_dir=

# 启动后是否自动打开浏览器（true / false）
open_browser=true

# 是否允许局域网内其他电脑访问（true / false）。true 时其他电脑用 http://本机IP:端口 访问
allow_lan=true

# 每天第一次修改前自动备份 CSV 到 csv\backup\日期\ 目录，保留天数（0 = 不备份）
backup_days=30
